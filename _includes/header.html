<header class="site-header">
  <div class="site-header-inner">
    <a href="{% if page.lang == 'fr' %}/{% else %}/en/{% endif %}" class="site-logo">
      <span class="logo-mark">JP</span>
      <span class="logo-text">jphenri<span>.ca</span></span>
    </a>

    {% include nav.html %}

    <div class="lang-switcher">
      {% if page.lang == 'fr' %}
        <span class="lang current">FR</span>
        <a href="{{ page.en_url | default: '/en/' }}" class="lang" aria-label="Switch to English">EN</a>
      {% else %}
        <span class="lang current">EN</span>
        <a href="{{ page.fr_url | default: '/' }}" class="lang" aria-label="Passer en français">FR</a>
      {% endif %}
    </div>
  </div>
</header>
