title: "J.P. Henri"
description: "Web, AI and automation for local projects and small businesses – by J.P. Henri"
url: "https://jphenri.ca"
baseurl: "" # important for custom domain

# Default language
lang: "fr"

# Supported languages
languages:
  - en
  - fr

author:
  name: "J.P. Henri"
  email: "info@jphenri.ca"

# Build settings
markdown: kramdown
permalink: /:categories/:title/

# No theme: we use our own layouts
# theme: null

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: page
      lang: "fr"
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: "fr"
    values:
      lang: "fr"
      noindex: true
      sitemap: false

# Navigation labels (used in templates if needed)
nav:
  en:
    home: "Home"
    business: "Approach"
    devops: "DevOps / IT"
    homelab: "Home Lab"
    projects: "Projects"
    blog: "Blog"
    contact: "Contact"
  fr:
    home: "Accueil"
    business: "Approche"
    devops: "DevOps / TI"
    homelab: "Home Lab"
    projects: "Projets"
    blog: "Blog"
    contact: "Contact"

# Social
social:
  github: "https://github.com/jphenri"
  linkedin: "https://www.linkedin.com/in/jphenri"

# Plugins
plugins:
  - jekyll-sitemap
